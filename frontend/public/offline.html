<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DMD Jewellery | You're Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #000000;
        color: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #0f172a;
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 24px;
        padding: 40px 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      }
      .logo {
        width: 84 h-84;
        width: 84px;
        height: 84px;
        border-radius: 20px;
        margin: 0 auto 24px;
        border: 2px solid #D4AF37;
        object-fit: cover;
      }
      .gold-title {
        font-family: "Playfair Display", Georgia, serif;
        color: #D4AF37;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .tagline {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 24px;
        font-style: italic;
      }
      .divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
        margin: 20px 0;
      }
      .message-heading {
        color: #ffffff;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .message-body {
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
        color: #0b0f19;
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 14px 28px;
        border-radius: 12px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
      }
      .btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="DMD Jewellery" class="logo" />
      <h1 class="gold-title">DMD JEWELLERY</h1>
      <p class="tagline">Timeless Elegance. Beautifully Crafted.</p>
      
      <div class="divider"></div>

      <h2 class="message-heading">You're currently offline</h2>
      <p class="message-body">
        Some previously visited content may still be available.<br>
        Please reconnect to view the latest jewellery collection and prices.
      </p>

      <button onclick="window.location.reload()" class="btn">RETRY CONNECTION</button>
    </div>
  </body>
</html>
